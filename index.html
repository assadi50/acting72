yle>body{font-family:Tahoma,Arial,sans-serif;color:#12323C;max-width:820px;margin:32px auto;padding:0 20px;line-height:1.8}h1{color:#006682;margin:0}h2{font-size:17px;color:#006682;border-bottom:2px solid #F3B120;padding-bottom:4px;margin-top:26px}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid #e3eaec}.bar{height:10px;background:#e3eaec;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#006682}.muted{color:#5f7480;font-size:13px}</style></head><body>\n  <div class="muted">مجموعة المعارف · المسار الثاني · المحاكاة القيادية «72 ساعة بالإنابة» · ${esc(S.team)}</div><h1>${esc(e)}</h1><div>${t.led.map((t=>`المشهد ${t.n}: ${t.t}`)).join(" · ")}</div><div>الجاهزية: <b>${s[1]}</b> · متوسط المعايير المقاسة: <b>${t.avg}</b></div>\n  <h2>معايير الجاهزية</h2><table>${COMPS.map((e=>`<tr><td>${e.n}</td><td style="width:45%">${null!=t.p[e.id]?`<div class="bar"><i style="width:${t.p[e.id]}%"></i></div>`:'<span class="muted">لم يُقَس</span>'}</td><td>${t.p[e.id]??""}</td></tr>`)).join("")}</table>\n  <h2>المساهمة في مؤشرات المركز</h2><p>${KEYS.map((e=>`${PIL[e]} ${sgn(t.con[e])}`)).join(" · ")}</p>\n  <h2>القرارات وأثرها</h2><table>${t.items.map((t=>`<tr><td><b>${esc(t.title)}</b><br><span class="muted">${esc(t.note||"")}</span></td><td>${KEYS.filter((e=>t.eff[e])).map((e=>`${PIL[e]} ${sgn(t.eff[e])}`)).join(" · ")}</td></tr>`)).join("")}</table>\n  ${t.low?`<h2>أولوية التطوير</h2><p><b>${t.low.n}</b>: ${LOWTIP[t.low.id]}<br><span class="muted">${t.low.day}</span></p>`:""}\n  <h2>التزام التطبيق</h2><p>${esc($("#cmt")?$("#cmt").value:"")}</p><p class="muted">بطاقة تدريبية تدخل في ملف الجاهزية، ولا تُعد وحدها قرار اختيار. السيناريو والأسماء والأرقام افتراضية لأغراض التدريب.</p></body></html>`}document.documentElement.lang="ar",hud(),dock(),renderBrief();</script>
